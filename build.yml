name: Build Windows EXE and Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    name: Windows portable EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q
      - name: Install tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          choco install ghostscript --yes --no-progress
      - name: Bundle Ghostscript runtime and build
        shell: pwsh
        run: |
          $roots = @(Get-ChildItem 'C:\Program Files\gs' -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending)
          if ($roots.Count -eq 0) { throw 'Ghostscript installation not found' }
          $root = $roots[0].FullName
          New-Item -Type Directory -Force 'gs/bin','gs/Resource','gs/lib' | Out-Null
          Copy-Item "$root/bin/gswin64c.exe" gs/bin/
          Copy-Item "$root/bin/gsdll64.dll" gs/bin/
          Copy-Item "$root/Resource/*" gs/Resource/ -Recurse -Force
          if (Test-Path "$root/lib") { Copy-Item "$root/lib/*" gs/lib/ -Recurse -Force }
          python -m PyInstaller --noconfirm --clean --paths . --windowed --onefile --name HUB3A_Generator --add-data 'core/bwipp.ps;core' --add-data 'gs;gs' desktop/app.py
          if (!(Test-Path 'dist/HUB3A_Generator.exe')) { throw 'EXE missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: HUB3A_Windows_EXE
          path: dist/HUB3A_Generator.exe
          if-no-files-found: error
          retention-days: 7
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HUB3A_Android_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
